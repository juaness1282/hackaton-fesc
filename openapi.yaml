{
  "openapi": "3.1.0",
  "info": {
    "title": "Legacy Escape",
    "version": "1.0.0",
    "description": "API v1 de transición de Afiliaciones. Consultas canónicas, retiros idempotentes y seguimiento de solicitudes persistidas durante caídas. El consumidor móvil solo tiene permisos de lectura."
  },
  "paths": {
    "/health": {
      "get": {
        "summary": "Consultar salud",
        "operationId": "health_health_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                },
                "example": {
                  "status": "UP",
                  "legacy": "UP"
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Error interno",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          }
        },
        "tags": [
          "Salud"
        ],
        "description": "Devuelve 200 mientras el gateway responde. legacy informa UP o DOWN independientemente de status. No requiere token."
      }
    },
