            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Document"
            },
            "description": "Documento del afiliado; para retiros se valida entre uno y quince dígitos.",
            "example": "1019886173"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Member"
                },
                "example": {
                  "document": "1019886173",
                  "fullName": "MONICA PABON MENDOZA",
                  "status": "RETIRED",
                  "company": {
                    "id": "2015",
                    "name": "LOGISTICA LA PLAYA SAS"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Token ausente o inválido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Token requerido o inválido",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "404": {
            "description": "Registro no encontrado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Registro no encontrado",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "503": {
            "description": "Legacy temporalmente no disponible",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Base temporalmente no disponible",
                  "error_id": "00000000-0000-4000-8000-000000000001",
                  "code": "LEGACY_UNAVAILABLE"
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Error interno",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          }
        },
        "tags": [
          "Afiliaciones"
        ],
        "description": "Respuesta canónica; status puede ser ACTIVE, RETIRED o SUSPENDED."
      }
    },
