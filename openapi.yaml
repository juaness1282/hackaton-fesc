    "/api/v1/members/{document}/retirements": {
      "post": {
        "summary": "Registrar retiro",
        "operationId": "retirement_api_v1_members__document__retirements_post",
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "parameters": [
          {
            "name": "document",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Document"
            },
            "description": "Documento del afiliado; para retiros se valida entre uno y quince dígitos.",
            "example": "1019886173"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RetirementInput"
              },
              "example": {
                "requestId": "demo-retiro-1",
                "date": "2026-10-15",
                "reason": "Retiro de demostración"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Retiro confirmado y comprobante registrado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                },
                "example": {
                  "requestId": "demo-retiro-1",
                  "movement": 42,
                  "status": "completed"
                }
              }
            }
          },
          "200": {
            "description": "Solicitud repetida ya confirmada, sin duplicar el movimiento",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                },
                "example": {
                  "requestId": "demo-retiro-1",
                  "movement": 42,
                  "status": "completed"
                }
              }
            }
          },
          "202": {
            "description": "Solicitud persistida en cola, pendiente de aplicar",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                },
                "example": {
                  "requestId": "demo-retiro-1",
                  "movement": null,
                  "status": "pending"
                }
              }
            }
          },
          "401": {
            "description": "Token ausente o inválido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Token requerido o inválido",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "403": {
            "description": "El consumidor móvil no puede escribir",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Este consumidor es de solo lectura",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "404": {
            "description": "Registro no encontrado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Registro no encontrado",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "409": {
            "description": "requestId reutilizado con otro documento, fecha o motivo",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "requestId pertenece a otra solicitud",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "422": {
            "description": "Documento o cuerpo inválido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Datos de solicitud inválidos",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Error interno",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          }
        },
        "tags": [
          "Retiros"
        ],
        "description": "Reutilizar requestId y el mismo contenido para reintentar. Primera confirmación 201; repetición confirmada 200; solicitud persistida pendiente 202. La persistencia local precede al intento de escritura. Consultar el seguimiento para conocer el resultado de un 202."
      }
    },
    "/api/v1/retirement-requests/{request_id}": {
      "get": {
        "summary": "Consultar una solicitud",
        "operationId": "request_status_api_v1_retirement_requests__request_id__get",
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "parameters": [
          {
            "name": "request_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "title": "Request Id"
            },
            "description": "Identificador usado al aceptar el retiro.",
            "example": "demo-retiro-1"
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                },
                "examples": {
                  "pending": {
                    "summary": "pending",
                    "value": {
                      "requestId": "demo-retiro-1",
                      "movement": null,
                      "status": "pending"
                    }
                  },
                  "completed": {
                    "summary": "completed",
                    "value": {
                      "requestId": "demo-retiro-1",
                      "movement": 42,
                      "status": "completed"
                    }
                  },
                  "not_found": {
                    "summary": "not_found",
                    "value": {
                      "requestId": "demo-retiro-1",
                      "movement": null,
                      "status": "not_found"
                    }
                  },
                  "conflict": {
                    "summary": "conflict",
                    "value": {
                      "requestId": "demo-retiro-1",
                      "movement": null,
                      "status": "conflict"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Token ausente o inválido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Token requerido o inválido",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "404": {
            "description": "Registro no encontrado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Registro no encontrado",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Error interno",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          }
        },
        "tags": [
          "Retiros"
        ],
        "description": "Respuesta 200 con estado pending, completed, not_found o conflict. El identificador de solicitud puede existir aunque su aplicación termine not_found; 404 indica que la solicitud no existe en la cola local."
      }
    },
    "/api/v1/migration/status": {
      "get": {
        "summary": "Consultar migración",
        "operationId": "migration_status_api_v1_migration_status_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Migration"
                },
                "example": {
                  "domains": {
                    "affiliations": "DUAL",
                    "retirements": "DUAL",
                    "companies": "LEGACY"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Token ausente o inválido",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Token requerido o inválido",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Error interno",
                  "error_id": "00000000-0000-4000-8000-000000000001"
                }
              }
            }
          }
        },
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "tags": [
          "Migración"
        ],
        "description": "Solo consulta. Afiliaciones y Retiros se administran conjuntamente mediante comandos locales; no hay endpoint de promoción o rollback."
      }
    }
  },
  "components": {
    "schemas": {
      "Beneficiary": {
        "properties": {
          "document": {
            "type": "string",
            "title": "Document"
          },
          "fullName": {
            "type": "string",
            "title": "Fullname"
          },
          "relationship": {
            "type": "string",
            "enum": [
              "SPOUSE",
              "CHILD",
              "FATHER",
              "MOTHER"
            ],
            "title": "Relationship"
          }
        },
        "type": "object",
        "required": [
          "document",
          "fullName",
          "relationship"
        ],
        "title": "Beneficiary"
      },
      "Company": {
        "properties": {
          "id": {
            "type": "string",
            "title": "Id"
          },
          "name": {
            "type": "string",
            "title": "Name"
          },
          "activeMembers": {
            "type": "integer",
            "title": "Activemembers"
          }
        },
        "type": "object",
        "required": [
          "id",
          "name",
          "activeMembers"
        ],
        "title": "Company"
      },
      "Error": {
        "properties": {
          "message": {
            "type": "string",
            "title": "Message"
          },
          "error_id": {
            "type": "string",
            "title": "Error Id"
          },
          "code": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Code"
          }
        },
        "type": "object",
        "required": [
          "message",
          "error_id"
        ],
        "title": "Error",
        "description": "Formato de errores de aplicación del gateway. Las rutas desconocidas y algunos errores del router tienen pendiente la unificación descrita en la auditoría."
      },
      "Health": {
        "properties": {
          "status": {
            "type": "string",
            "const": "UP",
            "title": "Status"
          },
          "legacy": {
            "type": "string",
            "enum": [
              "UP",
              "DOWN"
            ],
            "title": "Legacy"
          }
        },
        "type": "object",
        "required": [
          "status",
          "legacy"
        ],
        "title": "Health"
      },
      "Member": {
        "properties": {
          "document": {
            "type": "string",
            "title": "Document"
          },
          "fullName": {
            "type": "string",
            "title": "Fullname"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "RETIRED",
              "SUSPENDED"
            ],
            "title": "Status"
          },
          "company": {
            "$ref": "#/components/schemas/Organization"
          }
        },
        "type": "object",
        "required": [
          "document",
          "fullName",
          "status",
          "company"
        ],
        "title": "Member"
      },
      "Migration": {
        "properties": {
          "domains": {
            "additionalProperties": {
              "type": "string",
              "enum": [
                "LEGACY",
                "DUAL",
                "MODERN"
              ]
            },
            "type": "object",
            "title": "Domains"
          }
        },
        "type": "object",
        "required": [
          "domains"
        ],
        "title": "Migration"
      },
      "Organization": {
        "properties": {
          "id": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Id"
          },
          "name": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Name"
          }
        },
        "type": "object",
        "required": [
          "id",
          "name"
        ],
        "title": "Organization"
      },
      "Receipt": {
        "properties": {
          "requestId": {
            "type": "string",
            "title": "Requestid"
          },
          "movement": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Movement"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "completed",
              "not_found",
              "conflict"
            ],
            "title": "Status"
          }
        },
        "type": "object",
        "required": [
          "requestId",
          "movement",
          "status"
        ],
        "title": "Receipt",
        "description": "Estado de una solicitud persistente. movement solo está disponible al quedar completed."
      },
      "RetirementInput": {
        "properties": {
          "requestId": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Requestid"
          },
          "date": {
            "type": "string",
            "format": "date",
            "title": "Date"
          },
          "reason": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Reason"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "requestId",
          "date",
          "reason"
        ],
        "title": "RetirementInput"
      }
    },
    "securitySchemes": {
      "HTTPBearer": {
